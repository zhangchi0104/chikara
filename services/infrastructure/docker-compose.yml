services:
  traefik:
    image: traefik:v3.7
    restart: unless-stopped
    command:
      - --api.dashboard=true
      - --api.insecure=false
      - --entrypoints.web.address=:80
      - --ping=true
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=${TRAEFIK_NETWORK:-chikara-gateway}
    ports:
      - 127.0.0.1:${TRAEFIK_HTTP_PORT:-8081}:80
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - gateway
    labels:
      traefik.enable: "true"
      traefik.http.routers.traefik.entrypoints: web
      traefik.http.routers.traefik.rule: Host(`traefik.localhost`)
      traefik.http.routers.traefik.service: api@internal
    healthcheck:
      test: [CMD, traefik, healthcheck, --ping]
      interval: 10s
      timeout: 5s
      retries: 3

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-chikara}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chikra}
      POSTGRES_USER: ${POSTGRES_USER:-chikara}
    ports:
      - 127.0.0.1:${POSTGRES_PORT:-5432}:5432
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - gateway
    healthcheck:
      test: [CMD-SHELL, pg_isready --username=$$POSTGRES_USER --dbname=$$POSTGRES_DB]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: quay.io/minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address :9001
    environment:
      MINIO_BROWSER_REDIRECT_URL: http://minio.localhost:${TRAEFIK_HTTP_PORT:-8081}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-chikara-minio-password}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-chikara}
    volumes:
      - minio-data:/data
    networks:
      - gateway
    labels:
      traefik.enable: "true"
      traefik.http.routers.minio-api.entrypoints: web
      traefik.http.routers.minio-api.rule: Host(`s3.localhost`)
      traefik.http.routers.minio-api.service: minio-api
      traefik.http.routers.minio-console.entrypoints: web
      traefik.http.routers.minio-console.rule: Host(`minio.localhost`)
      traefik.http.routers.minio-console.service: minio-console
      traefik.http.services.minio-api.loadbalancer.server.port: "9000"
      traefik.http.services.minio-console.loadbalancer.server.port: "9001"

networks:
  gateway:
    name: ${TRAEFIK_NETWORK:-chikara-gateway}

volumes:
  minio-data:
  postgres-data:
