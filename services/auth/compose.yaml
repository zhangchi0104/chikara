name: auth

services:
  api:
    image: chikara/auth:dev
    build:
      context: "../.."
      dockerfile: "services/auth/Dockerfile"
      target: development
    environment:
      DATABASE_URL: "${DATABASE_URL:-postgres://chikara:chikra@postgres:5432/chikara_auth}"
      PORT: "3000"
    volumes:
      - ./src:/workspace/services/auth/src:ro
    networks:
      - gateway
    labels:
      traefik.enable: "true"
      traefik.docker.network: "${TRAEFIK_NETWORK:-chikara-gateway}"
      traefik.http.routers.auth.entrypoints: web
      traefik.http.routers.auth.rule: "Host(`auth.localhost`)"
      traefik.http.routers.auth.service: auth
      traefik.http.services.auth.loadbalancer.server.port: "3000"
    healthcheck:
      test: [CMD, bun, -e, "const response = await fetch('http://127.0.0.1:3000/health'); if (!response.ok) process.exit(1)"]
      interval: 10s
      timeout: 3s
      retries: 3

networks:
  gateway:
    external: true
    name: "${TRAEFIK_NETWORK:-chikara-gateway}"
